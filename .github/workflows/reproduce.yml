name: Reproduce case studies
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python run_all.py
      - uses: actions/upload-artifact@v4
        with:
          name: results-and-figures
          path: |
            results/
            figures/
